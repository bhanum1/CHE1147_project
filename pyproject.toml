[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "egfr-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.3",
    "pandas>=2.2",
    "scikit-learn>=1.9",
    "rdkit>=2024.3",
    "matplotlib>=3.10",
    "joblib>=1.4",
    "seaborn>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
profiling = ["ydata-profiling>=4.12"]

[tool.setuptools.packages.find]
where = ["src"]
